# ============================================================================
# bentoo — example configuration file
# ============================================================================
#
# Copy this file to one of these paths (read in priority order):
#
#   1. ~/.config/bentoo/config.yaml        (XDG default — recommended)
#   2. ~/.bentoo/config.yaml               (legacy fallback)
#
# When $XDG_CONFIG_HOME is set, path 1 becomes
# $XDG_CONFIG_HOME/bentoo/config.yaml.
#
# Quick install:
#   mkdir -p ~/.config/bentoo
#   cp config.example.yaml ~/.config/bentoo/config.yaml
#
# Notes:
#   - Unknown keys do NOT stop the file from loading, but each one prints a
#     warning on stderr — useful for catching typos and keys in the wrong
#     section.
#   - The only key most overlay commands need is overlay.path. Everything else
#     has a default or is optional.
#   - bentoo writes this file with mode 0600 as a precaution, but secrets do
#     not belong here: they go in ~/.config/bentoo/secrets (NAME=value lines).
#   - --check/--apply concurrency is NOT configured here: it is the
#     `--concurrency N` command-line flag (default: 10).

# ----------------------------------------------------------------------------
# overlay — the Gentoo overlay bentoo manages
# ----------------------------------------------------------------------------
overlay:
  # Overlay root. "~" expands to the home directory. It must contain profiles/
  # and metadata/ (create them with `bentoo overlay init` if they are missing).
  path: ~/overlays/my-overlay
  # Git remote used by `bentoo overlay push` / `sync` (default: origin).
  remote: origin

# ----------------------------------------------------------------------------
# git — the identity on the commits bentoo creates.
# When omitted, bentoo reads user.name/user.email from ~/.gitconfig.
# ----------------------------------------------------------------------------
git:
  user: "Your Name"
  email: "you@example.com"

# ----------------------------------------------------------------------------
# autoupdate — behaviour of `bentoo overlay autoupdate`
# ----------------------------------------------------------------------------
autoupdate:
  # TTL of the --check result cache, in seconds (default: 3600 = 1h).
  cache_ttl: 3600
  # Per-request HTTP timeout during --check, in seconds (default: 30).
  # Also adjustable for one run with the `--timeout` command-line flag.
  http_timeout: 30

  # Directory handed to `pkgdev manifest` as --distdir on the autoupdate path —
  # the same meaning `overlay manifest --distdir` has. Unset (the default)
  # means the host's own DISTDIR, as `portageq distdir` reports it.
  # distdir: /var/cache/distfiles

  # Read-only distfiles cache consulted before a download (default:
  # /var/cache/distfiles). Files are symlinked into the working distdir and
  # never written back.
  # distfiles_cache: /var/cache/distfiles

  # --------------------------------------------------------------------------
  # review — time limit of one `bentoo overlay compare` divergence review.
  #
  # The setting belongs to `compare`, but it lives inside `autoupdate` on
  # purpose: top-level keys have to be listed by hand in the loader, and a new
  # key missing from that list makes every command print a warning on stderr.
  # Nested here, it is already on that list.
  # --------------------------------------------------------------------------
  review:
    # Timeout of ONE divergence review, in seconds (default: 300).
    # There is NO flag for it: `overlay compare --timeout` is the HTTP request
    # timeout, and this key is the only way to set the review's.
    timeout: 300

  # --------------------------------------------------------------------------
  # validate — how much of a staged bump is checked before it is published.
  #
  # Every key is optional; the commented values below are the defaults.
  # Depth rungs, shallowest first, each including the ones before it:
  #   none | options | patches | configure | compile | install
  # `compile` is never a default: ask for it with --depth/--compile or with a
  # per-package override that states its reason.
  # --------------------------------------------------------------------------
  # validate:
  #   # Depth per bump class.
  #   depths:
  #     revision: options      # -r1 -> -r2
  #     patch: options         # 1.2.3 -> 1.2.4
  #     series: configure      # 1.2.x -> 1.3.0
  #     major: configure       # 1.x -> 2.0
  #
  #   # Skip a compile gate instead of running it without network isolation,
  #   # so a pass never claims more than it proved. Off by default because
  #   # `unshare --net` is denied on ordinary hosts.
  #   require_isolation: false
  #
  #   # Refuse to publish a bump whose validation could not reach the depth
  #   # asked for. The unreached depth is reported either way.
  #   require_proof: false
  #
  #   # The two LLM capabilities are switched ON by the --llm flag; these keys
  #   # can only switch them back OFF. Leave them unset to follow the flag —
  #   # writing `false` disables the capability even when --llm is given.
  #   # review: false
  #   # fix_on_failure: false
  #
  #   # Time limit of one agent run (reviewer or build fixer), in seconds
  #   # (default: 3600).
  #   timeout: 3600
  #
  #   # Per-package overrides, keyed by category/name. `reason` is required:
  #   # an override is the one input that can quietly reduce how much a bump
  #   # is checked. These entries are added to the shipped ones
  #   # (www-client/chromium, app-office/libreoffice, net-libs/webkit-gtk and
  #   # dev-lang/ghc at `none`); writing one of those keys replaces it.
  #   packages:
  #     dev-libs/example:
  #       depth: compile
  #       reason: carries a local patch that only a build exercises

  # --------------------------------------------------------------------------
  # llm — AI provider used by the automatic repairs:
  #   * Manifest auto-fix during --apply (broken SRC_URI/Manifest)
  #   * registry entry repair at the end of --check
  #
  # Two providers are available:
  #
  #   provider: claude-code   <- RECOMMENDED for the automatic repairs.
  #       Uses the local `claude` CLI and YOUR subscription session (it spends
  #       no API credits). It is the ONLY provider that enables the agentic
  #       repairs (editing the ebuild and running pkgdev). Needs the `claude`
  #       CLI installed and signed in. Do NOT set api_key_env with it.
  #
  #   provider: claude        <- HTTP provider over the Anthropic API (billed
  #       per token). Used by the discovery/analysis flows, NOT by the agentic
  #       repairs. Needs api_key_env naming the variable that holds the key.
  #
  # Omit the whole llm section (or comment it out) to disable every LLM use.
  # --------------------------------------------------------------------------
  llm:
    provider: claude-code
    # model: ""                # specific model (empty = the provider's default)
    bare: auto                 # CLI bare mode: auto | true | false
    # max_budget_usd: 5.0      # optional spend cap passed to the CLI (--max-budget-usd)
    # api_key_env: ANTHROPIC_API_KEY   # needed ONLY for provider: claude (API)

  # --------------------------------------------------------------------------
  # search — optional search provider for the discovery flows.
  # --------------------------------------------------------------------------
  # search:
  #   provider: perplexity
  #   api_key_env: PERPLEXITY_API_KEY

# ----------------------------------------------------------------------------
# repositories — extra sources used by `revive` and comparisons (optional).
# Key = logical name; provider is one of github | gitlab | git | local.
# ----------------------------------------------------------------------------
# repositories:
#   gentoo:
#     provider: local          # on-disk tree, read in place (no clone)
#     path: /var/db/repos/gentoo
#   my-fork:
#     provider: github
#     url: user/repo           # "org/repo" or a full URL
#     branch: main             # default: master/main
#   # The repository token does NOT go here. Set BENTOO_REPO_MY_FORK_TOKEN in
#   # ~/.config/bentoo/secrets (chmod 600) or in the environment.

# ----------------------------------------------------------------------------
# ui — how the long-running commands (autoupdate, overlay manifest) draw.
#
# Accepted modes: auto | plain | inline | fullscreen
#   auto        decides by itself: inline on a terminal, plain on a pipe/CI.
#   plain       line by line, no cursor control — pipes, logs, CI.
#   inline      redraws in place, inside the normal scrollback.
#   fullscreen  takes over the whole terminal while running (never automatic).
#
# The key ships COMMENTED on purpose: absent is NOT the same as `auto`.
# Without it, commands behave exactly as they did before this option existed
# (in practice the result matches `auto`, but writing the key is an explicit
# choice, and that is what the code can tell apart).
#
# Precedence: `--ui <mode>` > BENTOO_UI > ui.mode > auto.
# `--no-tui`, BENTOO_NO_TUI and NO_COLOR mean plain and win over all three.
# ----------------------------------------------------------------------------
# ui:
#   mode: auto

# ----------------------------------------------------------------------------
# notice — where `bentoo notice new|revise` writes the "site" half of a notice.
#
# site_path is the root of the website repository; the notice YAML goes to
# <site_path>/src/content/notices/<id>.yaml. A leading `~/` expands to the
# home directory. Without the key, the command writes only the news item into
# the overlay and prints the YAML on standard output.
# ----------------------------------------------------------------------------
# notice:
#   site_path: ~/Projects/obentoo.org/coming-soon

# ----------------------------------------------------------------------------
# tray — the bentoo-tray desktop notifier.
#
# interval            time between feed checks (default 6h; minimum 1h — a
#                     smaller value becomes 1h with a warning).
# feed_url            the notices feed (default https://obentoo.org/notices.json;
#                     only https is accepted).
# mute                types that are marked unread but raise no notification:
#                     release, news, announcement. `security` can never be
#                     muted and is ignored with a warning.
# downgrade_critical  send critical notices with normal urgency (default false).
# skip_metered        do not check the feed on a metered connection
#                     (default true).
# ----------------------------------------------------------------------------
# tray:
#   interval: 6h
#   feed_url: https://obentoo.org/notices.json
#   mute: [release]
#   downgrade_critical: false
#   skip_metered: true
