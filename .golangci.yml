version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - gocritic
    - ineffassign
    - gocognit
    - unparam
    - misspell
    - bodyclose
    - exhaustive
    - contextcheck
    - containedctx
    - noctx
    - errorlint
    - nilerr
    - usetesting
    - tparallel
    - forbidigo
    - nolintlint
    - gochecknoglobals
    - sloglint
    - depguard

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*github.com/fatih/color.Color).Printf
        - (*github.com/fatih/color.Color).Println
        - (*github.com/fatih/color.Color).Fprintf
        - (*github.com/fatih/color.Color).Fprintln
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Println
        - (*github.com/spf13/cobra.Command).GenBashCompletion
        - (*github.com/spf13/cobra.Command).GenZshCompletion
        - (*github.com/spf13/cobra.Command).GenFishCompletion
        - (*github.com/spf13/cobra.Command).GenPowerShellCompletionWithDesc

    depguard:
      rules:
        # Imports that must not come back once removed. A module can stay in
        # go.sum through a dependency's tests; this rule only stops our code
        # from linking it again.
        retired:
          deny:
            - pkg: gopkg.in/yaml.v3
              desc: archived upstream (2025-04-01) and unmaintained; use go.yaml.in/yaml/v3, its maintained continuation
    nolintlint:
      require-explanation: true
      require-specific: true
    forbidigo:
      # A list, so story 058 can append its os.Exit entry beside this one.
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: library code does not print to stdout; return a value or use internal/common/output
        - pattern: ^os\.Exit$
          msg: only func main ends the process; a handler returns exitWith(code) or an error
      # Resolve the package behind an identifier, so a renamed import of os
      # (`import osx "os"`) cannot hide an os.Exit from the rule above.
      analyze-types: true
    gocognit:
      # The linter's own default. A function above it is hard to follow and to
      # change safely; split it instead of raising this number.
      min-complexity: 30
    exhaustive:
      # A default clause counts as handling the rest; a switch without one must
      # name every value, so a value added later fails the lint where it is
      # not handled instead of falling through in silence.
      default-signifies-exhaustive: true
    sloglint:
      # Story 062 (R5.4, R5.5): no package-level slog logger, constant
      # messages, key-value pairs only, snake_case keys.
      no-global: all
      static-msg: true
      kv-only: true
      key-naming-case: snake
      args-on-sep-lines: false
    gosec:
      # G204 (subprocess launched with variable) is intentionally NOT excluded:
      # T6 added ValidateRepoURL/ValidateBranch so every git invocation now runs
      # against validated inputs, and the remaining call sites carry inline
      # //nolint:gosec justifications documenting why each is safe.
      excludes:
        - G104

  exclusions:
    # .epic holds staged authored tests and .claude holds agent worktrees (full
    # repository copies); neither is this module's code.
    paths:
      - ^\.epic/
      - ^\.claude/
    rules:
      # Scoped to the fmt.Print rule's text, so another forbidigo entry (the
      # os.Exit one story 058 appends) is not exempted with it.
      - path: (^cmd/|^internal/common/output/|^misc/|_test\.go$)
        linters:
          - forbidigo
        text: "fmt\\.Print"
      # Scoped to the os.Exit rule's text, so these paths stay under the
      # fmt.Print rule. Each binary's main.go is the one place its process
      # ends; misc/ holds standalone programs; tests end re-exec'd children and
      # TestMain.
      - path: (^cmd/bentoo(-tray)?/main\.go$|^misc/|_test\.go$)
        linters:
          - forbidigo
        text: "os\\.Exit"
      # gochecknoglobals guards cmd/bentoo's production code only (story 060,
      # R8.1, R8.2): every other package, and every test file, is out of its
      # scope.
      - path-except: ^cmd/bentoo/
        linters:
          - gochecknoglobals
      - path: _test\.go$
        linters:
          - gochecknoglobals
      # The baseline: the package-level variables cmd/bentoo still holds after
      # story 060 — the other commands' flags, the root persistent flags, the
      # legacy command lookups, the exit-cleanup registry and processSignals.
      # This list ONLY SHRINKS: a later story removes a name when it removes
      # the variable, and a new global is a lint failure, never a new name
      # here (R8.4). Re-derive it with
      #   golangci-lint run --enable-only gochecknoglobals ./cmd/bentoo/
      # after deleting this rule.
      - path: ^cmd/bentoo/
        linters:
          - gochecknoglobals
        text: '^(addCmd|analyzeAll|analyzeCmd|analyzeDryRun|analyzeForce|analyzeHint|analyzeNoCache|analyzeURL|autoupdateAll|autoupdateExport|autoupdateUI|commitCmd|commitDryRun|commitMessage|commitYes|compareCacheDir|compareCauseOrder|compareClone|compareCmd|compareConcurrency|compareDepth|compareNoCache|compareNoReview|compareOnlyOutdated|compareOnlyPatched|compareOnlyRedundant|compareRealign|compareSync|compareTimeout|compareToken|compareYes|completionCmd|diffCmd|diffStaged|distfileCmd|distfileFetchCmd|distfileFetchDistdir|distfileFetchVersion|exitCleanupNext|exitCleanups|exitCleanupsMu|initCmd|logCmd|logCount|logOneline|manifestCmd|manifestFlags|noColor|overlayCmd|processSignals|pruneApply|pruneIncludePatched|pruneKeepRegistry|pruneYes|pullCmd|pullDryRun|pullMerge|pullRebase|pushCmd|pushDryRun|quiet|renameCmd|renameFlags|rootCmd|snapshotApplyCmd|snapshotApplyDryRun|snapshotCmd|snapshotConfigPath|snapshotHookCmd|snapshotHookInstall|snapshotHookUninstall|snapshotListCmd|snapshotListRemote|snapshotPruneCmd|snapshotPruneDryRun|snapshotPruneShip|snapshotRestoreCmd|snapshotRestoreDryRun|snapshotRestoreShip|snapshotRestoreSubvolume|snapshotRestoreTarget|snapshotRestoreYes|snapshotRollbackCmd|snapshotRollbackDryRun|snapshotRollbackYes|snapshotRunCmd|snapshotRunDryRun|snapshotStatusCmd|stagedCleanYes|statusCmd|uiDowngradeReported|verbose|versionCmd) is a global variable$'
      # The baseline: the production functions already above 30 when gocognit
      # was enabled, each pinned to its score then. A function that grows, or
      # a new one above 30, fails the lint. One that shrinks fails too, until
      # its entry is lowered here, or removed once it is at or below 30: the
      # list ONLY SHRINKS, and the progress is recorded in review. Re-derive
      # it with
      #   golangci-lint run --enable-only gocognit ./...
      # after deleting this rule.
      - linters:
          - gocognit
        text: '^cognitive complexity (35 of func `\(\*App\)\.loop`|32 of func `AnnotateRealignVerdicts`|38 of func `FormatRenameResult`|37 of func `detectVersionBumps`|32 of func `displaySweepPlan`|35 of func `renderValidateText`|57 of func `runCompare`|35 of func `sendMailBounded`) is high'
      - path: _test\.go
        linters:
          - gocognit
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          # A test helper often takes a parameter its current callers all pass
          # the same way; that is the test's choice, not dead code.
          - unparam
          # httptest servers, fake commands and listeners live and die with
          # the test; a context on each adds nothing the test does not bound.
          - noctx
          # A test switches over the cases it builds, not over every value.
          - exhaustive
          # R5.5 binds production diagnostics; a test logs hostile, built
          # messages and attributes on purpose (the redaction tests).
          - sloglint
          # A test table carrying a context per case is idiomatic.
          - containedctx
          # A test's filepath.Walk callback skips an unreadable entry, and a
          # seam that has already called t.Error returns nil to let the run
          # finish; both are deliberate in every test that does it.
          - nilerr

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - ^\.epic/
      - ^\.claude/
