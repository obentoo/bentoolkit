version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Indirect dependencies are proposed too, not just direct ones. The default
    # ("direct") left everything transitive unwatched except golang.org/x/*,
    # which only slipped through because the group pattern below matches it. A
    # dependency-chain audit found github.com/mattn/go-isatty and
    # go-runewidth — both linked into the binary — sitting behind with no PR
    # ever opened for them. Being compiled in is what matters, not how the
    # requirement is spelled in go.mod. The extra volume is bounded by the PR
    # limit and the cooldown below.
    allow:
      - dependency-type: "all"
    # Watched in name only: github.com/chromedp/cdproto. It is a DIRECT
    # requirement and is linked into the binary (internal/autoupdate imports
    # cdproto/network), yet Dependabot has never opened a single PR for it --
    # `gh pr list --state all --search cdproto` is empty across the whole repo
    # history. Measured 2026-09-22, it sat five weeks behind (pinned
    # 2026-08-04, latest 2026-09-12) and was bumped by hand.
    #
    # The mechanism is NOT confirmed. The module carries no semver tag at all
    # (proxy.golang.org/github.com/chromedp/cdproto/@v/list answers empty), so
    # it looks like the same trap as the charmbracelet/x/exp pair below -- but
    # that was inferred from the absence of a PR, not read from an update-job
    # log, and those logs are UI-only (Insights -> Dependency graph ->
    # Dependabot). Ruled out by measurement: the 7-day cooldown (the candidate
    # was 10 days old) and open-pull-requests-limit (5 of 10 in use).
    #
    # Deliberately NOT listed under `ignore:`. Ignoring it would CAUSE the
    # silence rather than record it, and would throw away any chance Dependabot
    # starts resolving it. Until the job log is read, treat cdproto as a third
    # manual-bump dependency alongside the two ignored below -- which means the
    # 7-day quarantine is on you: check the pseudo-version's own date first.
    # Release quarantine: ignore versions newer than 7 days, dodging
    # the window when most hijacked/yanked packages are caught.
    cooldown:
      default-days: 7
    groups:
      # This group went silent after #128 (2026-08-24) and the cause is not
      # visible from the PR list -- Dependabot kept running and kept opening PRs
      # for everything else, so only the missing group PR recorded it.
      #
      # Every golang.org/x release from late August 2026 on declares `go 1.26.0`
      # in its own go.mod. This module declared `go 1.26`, and Go ranks a bare
      # `1.26` BELOW `1.26.0` -- so taking any of them required raising the main
      # module's `go` directive, which Dependabot will not do. It dropped the
      # whole group without a word. Cooldown was not the cause: #128 shipped
      # while x/mod v0.41.0 was still in quarantine, so per-dependency cooldown
      # demonstrably picks an older eligible version rather than blocking.
      #
      # Fixed on the module side (go.mod now says `go 1.26.0` plus a `toolchain`
      # line). If the group falls silent again, compare the `go` directive of the
      # candidate version against this module's before looking anywhere else.
      golang-x:
        patterns:
          - "golang.org/x/*"
    ignore:
      # Dependabot cannot resolve either of these, and has failed on them every
      # week since at least 2026-07-20 — quietly, because it processes every
      # other dependency and opens their PRs, so only the job's exit status
      # records that two were dropped.
      #
      # Neither module has ever carried a semver tag; both are consumed as
      # pseudo-versions. `@v/list` therefore answers empty and Dependabot walks
      # up the import path looking for one that is not:
      #
      #   github.com/charmbracelet/x/exp/teatest  -> empty
      #   github.com/charmbracelet/x/exp          -> empty
      #   github.com/charmbracelet/x              -> v0.1.0
      #
      # It stops at the parent, whose only tag is v0.1.0 from 2023 and whose
      # contents are a go.work, a LICENSE and a README. Asked for a package
      # that cannot be there, it reports dependency_file_not_resolvable.
      #
      # Ignoring outright rather than naming a version, because v0.1.0 sorts
      # ABOVE every pseudo-version (semver.Compare says so), so Dependabot sees
      # an upgrade on offer no matter how current the pin already is. Updating
      # them by hand — as 2026-08-27 did — does not quiet it either.
      #
      # Both are test-only: teatest drives the TUI test, golden arrives through
      # it, neither is linked into the binary. Bump them by hand and remember
      # to regenerate testdata/TestModelGoldenFrame.golden. Drop these entries
      # once upstream publishes real semver tags for the exp/ modules.
      - dependency-name: "github.com/charmbracelet/x/exp/teatest"
      - dependency-name: "github.com/charmbracelet/x/exp/golden"
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
