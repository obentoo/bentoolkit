version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Indirect dependencies are proposed too, not just direct ones. The default
    # ("direct") left everything transitive unwatched except golang.org/x/*,
    # which only slipped through because the group pattern below matches it. A
    # dependency-chain audit found github.com/mattn/go-isatty and
    # go-runewidth — both linked into the binary — sitting behind with no PR
    # ever opened for them. Being compiled in is what matters, not how the
    # requirement is spelled in go.mod. The extra volume is bounded by the PR
    # limit and the cooldown below.
    allow:
      - dependency-type: "all"
    # Release quarantine: ignore versions newer than 7 days, dodging
    # the window when most hijacked/yanked packages are caught.
    cooldown:
      default-days: 7
    groups:
      golang-x:
        patterns:
          - "golang.org/x/*"
    ignore:
      # v0.6100.0 is published under the wrong module path — its go.mod
      # declares github.com/mxschmitt/playwright-go, so the tag cannot be
      # resolved under the playwright-community name. Stay on v0.6000.0
      # until upstream retags. Drop this entry once a fixed release lands.
      - dependency-name: "github.com/playwright-community/playwright-go"
        versions: ["0.6100.0"]
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
