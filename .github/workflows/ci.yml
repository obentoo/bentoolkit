name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for every job; jobs widen only if they must.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      # Built from source on purpose, and it has to stay that way: golangci-lint
      # refuses to run when the Go it was built with is older than the Go the
      # module targets. The published v2.1.6 binary is built with go1.24.2, and
      # go.mod says 1.26, so it exits 3 before linting a line:
      #
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26)
      #
      # Installing from source rebuilds it with the runner's Go, which matches
      # by construction. The prebuilt asset was tried and reverted — see the
      # Secret Scan job, where gitleaks carries no such constraint and does take
      # the binary.
      #
      # The cost is a dependency tree resolved through proxy.golang.org and
      # sum.golang.org on every run, which broke three times on 2026-08-27
      # alone — twice here, once in Secret Scan, the last turning main red.
      # Every one of those cleared on a rerun, so retry the install rather than
      # let a transient stream error fail the job.
      - name: Install golangci-lint from source
        run: |
          for attempt in 1 2 3; do
            if go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6; then
              exit 0
            fi
            echo "::warning::go install failed (attempt ${attempt}/3), retrying"
            sleep "$((attempt * 15))"
          done
          echo "::error::go install failed three times; not a transient error"
          exit 1

      # golangci-lint skips a file behind a tag it was not given, exactly as
      # `go build` does, so `run ./...` on its own leaves both tagged script
      # evaluators unlinted — the same blind spot the tagged build and
      # govulncheck steps already exist for. `go vet -tags` in the build job is
      # not a substitute: it covers neither errcheck nor contextcheck, and an
      # audit found one real errcheck finding sitting behind the playwright tag
      # that had never been reported here. Lint once per tag.
      # No workflow expressions are interpolated; the loop variable is local to
      # this step and quoted.
      - name: Run golangci-lint
        run: |
          for tag in "" chromedp playwright; do
            label="${tag:-default}"
            echo "::group::golangci-lint (${label})"
            if [ -z "$tag" ]; then
              golangci-lint run ./...
            else
              golangci-lint run --build-tags "$tag" ./...
            fi
            echo "::endgroup::"
          done

      - name: Audit context spine
        run: make audit-ctx

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with coverage
        run: go test -v -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% is below the 80% minimum"
            exit 1
          fi

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Run govulncheck
        run: |
          # JSON mode always exits 0; we parse the findings ourselves.
          # govulncheck is pinned via the `tool` directive in go.mod (tracked by
          # Dependabot's golang-x group); invoked here with `go tool`.
          #
          # Analysed once per build tag, not just by default. govulncheck skips a
          # file behind a tag it was not given, exactly as `go build` does, so the
          # default run says nothing about chromedp or playwright-go — the two
          # modules whose call sites live only in the tagged script evaluators. A
          # reachable CVE in either would have gone unreported here.
          #
          # No workflow expressions are interpolated; the loop variable is local
          # to this step and quoted.
          failed=""
          for tag in "" chromedp playwright; do
            label="${tag:-default}"
            echo "::group::govulncheck (${label})"
            if [ -z "$tag" ]; then
              go tool govulncheck -json ./... > "/tmp/vulncheck-${label}.json"
            else
              go tool govulncheck -tags "$tag" -json ./... > "/tmp/vulncheck-${label}.json"
            fi
            # Count REACHABLE vulnerabilities (trace frame with a called function)
            # in third-party modules. stdlib/toolchain issues require a Go update,
            # not a dependency bump, so they don't fail this job.
            THIRD_PARTY=$(jq -s '
              [ .[] | .finding // empty
                | select(.trace[0].function != null)
                | .trace[0].module
                | select(. != "stdlib" and . != "toolchain")
              ] | unique | length' "/tmp/vulncheck-${label}.json")
            if [ "$THIRD_PARTY" -gt 0 ]; then
              echo "::error::${THIRD_PARTY} third-party vulnerability(ies) found (${label})"
              if [ -z "$tag" ]; then
                go tool govulncheck ./... || true
              else
                go tool govulncheck -tags "$tag" ./... || true
              fi
              failed="${failed} ${label}"
            else
              echo "No third-party vulnerabilities (${label})"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::govulncheck found third-party vulnerabilities under:${failed}"
            exit 1
          fi
          echo "No third-party vulnerabilities under any build tag (stdlib-only issues require a Go update)"

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks scans all commits
          persist-credentials: false

      # No setup-go here: nothing in this job runs Go any more. gitleaks
      # arrives as a binary and scans the git history, not the module graph.

      # Run the gitleaks binary directly instead of gitleaks-action, which
      # requires a GITLEAKS_LICENSE for orgs. Taken as the prebuilt release
      # asset rather than built from source, for the reason given on the
      # golangci-lint step above, and pinned by SHA256 for the same one.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --retry-all-errors -o gitleaks.tar.gz \
            "https://github.com/zricethezav/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan git history for secrets
        run: gitleaks git --redact -v .

  osv-scan:
    name: OSV Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --recursive
            ./

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build all targets
        run: make build-all

      # The browser-driven script evaluators sit behind build tags
      # (script_evaluator_chromedp.go is `//go:build chromedp && !playwright`,
      # its playwright sibling the mirror), so nothing above ever compiles them:
      # `go build ./...` and `go test ./...` both skip a tagged file entirely.
      # That left a dependency bump to chromedp or playwright-go passing CI fully
      # green while breaking the only code that calls it — the failure would
      # surface for whoever built with the tag, not here. Compile and vet both
      # tags so an incompatible bump fails in the PR that proposes it.
      # No workflow expressions are interpolated below; the loop variable is
      # local to the step and quoted.
      - name: Build and vet the tagged script evaluators
        run: |
          for tag in chromedp playwright; do
            echo "::group::-tags ${tag}"
            go build -tags "${tag}" ./...
            go vet -tags "${tag}" ./...
            echo "::endgroup::"
          done

  # A PR that changes what ships must say so in the changelog. Three releases in
  # a row nearly went out with notes that omitted whole changes — PR #57 before
  # 0.15.0, #60-63 before 0.15.2, #69-73 before this — every time because a merge
  # touched only go.mod/go.sum and nobody noticed until the release was being
  # cut. Dependency bumps are the recurring case: the tooling that opens them
  # does not write changelog entries, so the omission is silent by construction.
  #
  # This makes it loud instead. Add the entry, or label the PR `no-changelog`
  # when there genuinely is nothing to record (a test-only fix, a typo).
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # need the base branch to diff against
          persist-credentials: false

      - name: Require a changelog entry for user-visible changes
        env:
          # Passed through env, never interpolated into the script body.
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr view "$PR_NUMBER" --json labels \
               --jq '.labels[].name' | grep -qx 'no-changelog'; then
            echo "Labelled no-changelog; skipping."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_REF"
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")

          # What counts as user-visible: the module graph, and the code itself.
          # Test files are excluded — a test-only change ships nothing.
          relevant=$(echo "$changed" | grep -E '^(go\.mod|go\.sum)$|\.go$' \
                     | grep -vE '_test\.go$' || true)
          if [ -z "$relevant" ]; then
            echo "No user-visible change; changelog not required."
            exit 0
          fi

          if echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "Changelog updated alongside:"
            echo "$relevant" | sed 's/^/  /'
            exit 0
          fi

          echo "::error::This PR changes what ships but does not touch CHANGELOG.md"
          echo "Files that require an entry:"
          echo "$relevant" | sed 's/^/  /'
          echo
          echo "Add a line under [Unreleased], or label the PR 'no-changelog'."
          exit 1

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Static analysis of the workflows themselves (injection, excessive
      # permissions, credential persistence, unpinned actions). pipx is
      # preinstalled on GitHub-hosted runners; zizmor is pinned by version.
      - name: Run zizmor
        run: pipx run zizmor==1.25.2 --min-severity=medium .github/workflows/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
