# Pre-commit hooks. Install with:  pip install pre-commit && pre-commit install
# Update hook revs with:           pre-commit autoupdate --freeze
# (--freeze keeps every rev a commit SHA, with the tag in a comment.)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Refuses unformatted staged Go files and names them. gofmt -l only
      # lists, so the commit never rewrites a file behind your back.
      - id: gofmt
        name: gofmt
        language: system
        types: [go]
        entry: sh -c 'out="$(gofmt -l "$@")"; if [ -n "$out" ]; then echo "$out"; exit 1; fi' --
      - id: go-vet
        name: go vet
        language: system
        types: [go]
        pass_filenames: false
        entry: go vet ./...
